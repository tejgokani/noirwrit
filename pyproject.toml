[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noirwrit"
version = "0.1.0"
description = "Offline crime and noir chapter generator with its own small language model."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tej Gokani" }]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Operating System :: MacOS",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.26",
    "psutil>=5.9",
    "torch>=2.3",
    "tokenizers>=0.19",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "weasyprint>=61",
    "ebooklib>=0.18",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=2.7"]
data = ["requests>=2.31"]
export = ["gguf>=0.10", "safetensors>=0.4"]
train = ["huggingface_hub>=0.23"]
dev = ["pytest>=8", "ruff>=0.4", "pre-commit>=3.7", "httpx>=0.27"]

[project.scripts]
noirwrit = "noirwrit.cli:main"

[tool.setuptools.packages.find]
include = ["noirwrit*"]

[tool.setuptools.package-data]
noirwrit = ["tokenizer/*.json", "app/templates/*", "app/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long running tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]
